<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="빠른 가계부">
  <meta name="theme-color" content="#dc3545">
  <title>빠른 가계부 입력</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .qe-wrap { max-width: 460px; margin: 0 auto; }
    .qe-title { font-weight: 700; font-size: 1.3rem; }
    .qe-card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .qe-amount {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: right;
    }
    .qe-save-btn {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
    }
    .qe-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #212529;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 2000;
      white-space: nowrap;
    }
    .qe-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .qe-recent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f3f5;
      font-size: 0.9rem;
    }
    .qe-recent-item:last-child { border-bottom: none; }
    .qe-link { color: #6c757d; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="qe-wrap">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <span class="qe-title"><i class="bi bi-receipt me-2 text-danger"></i>빠른 가계부 입력</span>
    <a href="/budget" class="qe-link"><i class="bi bi-box-arrow-up-right me-1"></i>전체 가계부</a>
  </div>

  <div class="card qe-card mb-3">
    <div class="card-body p-3">
      <form id="qeForm">
        <div class="row g-2 mb-2">
          <div class="col-7">
            <label class="form-label small text-muted mb-1">날짜</label>
            <input type="date" id="qeDate" class="form-control" required>
          </div>
          <div class="col-5">
            <label class="form-label small text-muted mb-1">지출유형</label>
            <select id="qeType" class="form-select">
              <option value="변동지출" selected>변동지출</option>
              <option value="고정지출">고정지출</option>
            </select>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label small text-muted mb-1">항목명</label>
          <input type="text" id="qeName" class="form-control" placeholder="예: 스타벅스, 택시비" autocomplete="off" required>
        </div>

        <div class="mb-2">
          <label class="form-label small text-muted mb-1">금액</label>
          <div class="input-group">
            <input type="text" inputmode="numeric" id="qeAmount" class="form-control qe-amount" placeholder="0" required>
            <span class="input-group-text">원</span>
          </div>
        </div>

        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small text-muted mb-1">카테고리</label>
            <select id="qeCategory" class="form-select">
              <option value="">자동</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small text-muted mb-1">결제수단</label>
            <select id="qePayment" class="form-select">
              <option value="현금">현금</option>
              <option value="체크카드">체크카드</option>
              <option value="신용카드" selected>신용카드</option>
              <option value="계좌이체">계좌이체</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>

        <div class="mb-3" id="qeCardWrap">
          <label class="form-label small text-muted mb-1">카드</label>
          <select id="qeCard" class="form-select">
            <option value="">선택 안함</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small text-muted mb-1">메모 (선택)</label>
          <input type="text" id="qeMemo" class="form-control" placeholder="메모">
        </div>

        <button type="submit" class="btn btn-danger w-100 qe-save-btn">
          <i class="bi bi-check-lg me-1"></i>저장
        </button>
      </form>
    </div>
  </div>

  <div class="card qe-card">
    <div class="card-body p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-semibold small text-muted">오늘 입력한 내역</span>
        <span class="small text-muted" id="qeTodayTotal">0원</span>
      </div>
      <div id="qeRecentList">
        <div class="text-center text-muted small py-3">아직 입력한 내역이 없습니다.</div>
      </div>
    </div>
  </div>
</div>

<div class="qe-toast" id="qeToast"></div>

<script>
function fmt(n) {
  if (n == null || n === '') return '0';
  return Math.round(n).toLocaleString('ko-KR');
}
async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, opts);
  if (!res.ok) { console.error('API error', res.status, await res.text()); return null; }
  return res.json();
}

const todayStr = new Date().toISOString().split('T')[0];
document.getElementById('qeDate').value = todayStr;

let allCategories = [];
let allCards = [];

function updateCardVisibility() {
  const pm = document.getElementById('qePayment').value;
  const wrap = document.getElementById('qeCardWrap');
  wrap.style.display = (pm === '체크카드' || pm === '신용카드') ? '' : 'none';
}
document.getElementById('qePayment').addEventListener('change', updateCardVisibility);

// 금액 입력 콤마 자동 포맷
const amountEl = document.getElementById('qeAmount');
amountEl.addEventListener('input', () => {
  const digits = amountEl.value.replace(/[^\d]/g, '');
  amountEl.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
});

function showToast(msg) {
  const t = document.getElementById('qeToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

async function loadOptions() {
  const [cats, cards] = await Promise.all([
    fetchJSON('/api/budget-categories').then(r => r || []),
    fetchJSON('/api/cards').then(r => r || []),
  ]);
  allCategories = cats;
  allCards = cards;
  const catSel = document.getElementById('qeCategory');
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c.name; o.textContent = c.name;
    catSel.appendChild(o);
  });
  const cardSel = document.getElementById('qeCard');
  cards.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.card_name || ('카드' + c.card_num);
    cardSel.appendChild(o);
  });
  updateCardVisibility();
}

async function loadTodayEntries() {
  const [y, m] = todayStr.split('-');
  const rows = await fetchJSON(`/api/budget?year=${y}&month=${m}`).then(r => r || []);
  const todayRows = rows.filter(r => r.date === todayStr);
  const listEl = document.getElementById('qeRecentList');
  const totalEl = document.getElementById('qeTodayTotal');
  const total = todayRows.reduce((s, r) => s + (r.amount || 0), 0);
  totalEl.textContent = fmt(total) + '원';
  if (!todayRows.length) {
    listEl.innerHTML = '<div class="text-center text-muted small py-3">아직 입력한 내역이 없습니다.</div>';
    return;
  }
  listEl.innerHTML = todayRows.map(r => `
    <div class="qe-recent-item">
      <span>${r.category ? `<span class="badge bg-danger-subtle text-danger me-1">${r.category}</span>` : ''}${r.name || '-'}</span>
      <span class="d-flex align-items-center gap-2">
        <strong>${fmt(r.amount)}원</strong>
        <i class="bi bi-x-lg text-muted" style="cursor:pointer" onclick="deleteEntry(${r.id})"></i>
      </span>
    </div>
  `).join('');
}

async function deleteEntry(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await fetchJSON(`/api/budget/${id}`, { method: 'DELETE' });
  await loadTodayEntries();
}

document.getElementById('qeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const amount = parseFloat(amountEl.value.replace(/,/g, '')) || 0;
  const name = document.getElementById('qeName').value.trim();
  if (!name || amount <= 0) {
    showToast('항목명과 금액을 입력해주세요');
    return;
  }
  const payment_method = document.getElementById('qePayment').value;
  const cardVisible = document.getElementById('qeCardWrap').style.display !== 'none';
  const data = {
    date: document.getElementById('qeDate').value,
    name,
    amount,
    type: document.getElementById('qeType').value,
    category: document.getElementById('qeCategory').value,
    payment_method,
    card_id: cardVisible ? (document.getElementById('qeCard').value || null) : null,
    memo: document.getElementById('qeMemo').value.trim(),
  };
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  const result = await fetchJSON('/api/budget', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  submitBtn.disabled = false;
  if (!result) {
    showToast('저장 실패');
    return;
  }
  showToast('저장했습니다');
  document.getElementById('qeName').value = '';
  amountEl.value = '';
  document.getElementById('qeMemo').value = '';
  document.getElementById('qeName').focus();
  await loadTodayEntries();
});

loadOptions();
loadTodayEntries();
</script>
</body>
</html>
